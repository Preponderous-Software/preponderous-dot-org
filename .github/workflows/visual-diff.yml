name: Visual diff

# Advisory screenshot comparison of every pull request against its base
# (RFC 0038). The shots are listed in visual-diff.json. The job lives in
# community-site-kit (tools/visual-diff); bump both SHAs below together.
# A changed shot never fails this check: read the job summary.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  visual-diff:
    uses: kingdom-community/community-site-kit/.github/workflows/visual-diff.yml@04fdfc8856c5fa40396a451336e99ffdddacc70e
    with:
      kit-ref: 04fdfc8856c5fa40396a451336e99ffdddacc70e
